<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movix — prévia de abertura</title>
  <style>
    :root {
      --wine: #120609;
      --wine-2: #241116;
      --burgundy: #a3203f;
      --burgundy-dark: #3a0f1c;
      --cream: #e8dcc8;
      --cream-soft: #c9b79c;
      --muted: #b3a394;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080306; color: var(--cream); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    body { display: grid; place-items: center; overflow: hidden; }
    .stage {
      position: relative; width: min(100vw, 430px); height: min(100vh, 860px); min-height: 620px;
      overflow: hidden; isolation: isolate; background:
        radial-gradient(circle at 18% 13%, rgba(163,32,63,.33), transparent 28%),
        radial-gradient(circle at 90% 83%, rgba(122,32,54,.3), transparent 32%),
        linear-gradient(145deg, #401423 0%, var(--wine-2) 48%, var(--wine) 100%);
      box-shadow: 0 24px 80px rgba(0,0,0,.65);
    }
    .grain { position:absolute; inset:0; opacity:.08; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E"); mix-blend-mode:screen; }
    .orb { position:absolute; border-radius:50%; filter:blur(32px); opacity:.35; animation: drift 8s ease-in-out infinite alternate; }
    .orb.one { width:220px; height:220px; background:#c02b52; top:-100px; left:-90px; }
    .orb.two { width:270px; height:270px; background:#701c35; right:-150px; bottom:-110px; animation-delay:-3s; }
    .topline { position:absolute; top:22px; left:24px; right:24px; display:flex; justify-content:space-between; align-items:center; color:rgba(232,220,200,.56); font-size:10px; letter-spacing:.18em; text-transform:uppercase; }
    .topline b { color:var(--cream); font-weight:650; }
    .skip { border:0; background:none; color:inherit; cursor:pointer; letter-spacing:.13em; text-transform:uppercase; font-size:10px; opacity:.7; }
    .hero { position:absolute; inset:0; display:grid; place-items:center; padding-bottom:110px; }
    .mark-wrap { position:relative; width:250px; height:250px; display:grid; place-items:center; }
    .mark-wrap::before { content:""; position:absolute; width:180px; height:180px; border:1px solid rgba(232,220,200,.1); border-radius:50%; animation:ring 2.8s cubic-bezier(.2,.8,.2,1) both; }
    .mark-wrap::after { content:""; position:absolute; width:180px; height:180px; border:1px solid rgba(163,32,63,.36); border-radius:50%; animation:ring 2.8s .35s cubic-bezier(.2,.8,.2,1) both; }
    svg { width:250px; height:250px; overflow:visible; }
    .m-line { fill:none; stroke:var(--cream); stroke-width:25; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:760; stroke-dashoffset:760; animation:draw 1.35s .15s cubic-bezier(.6,0,.2,1) forwards; }
    .dot { fill:var(--burgundy); transform-box:fill-box; transform-origin:center; animation:drop 1.1s 1.15s cubic-bezier(.2,.85,.25,1.25) both, breathe 2.4s 2.25s ease-in-out infinite; }
    .dot-glow { fill:var(--burgundy); opacity:.35; filter:blur(10px); transform-origin:center; animation:drop 1.1s 1.15s cubic-bezier(.2,.85,.25,1.25) both, glow 2.4s 2.25s ease-in-out infinite; }
    .wordmark { position:absolute; top:258px; width:100%; text-align:center; font-size:25px; letter-spacing:.26em; padding-left:.26em; font-weight:680; opacity:0; animation:rise .7s 1.8s ease-out forwards; }
    .tagline { position:absolute; top:300px; width:100%; text-align:center; font-size:10px; letter-spacing:.22em; color:rgba(232,220,200,.58); text-transform:uppercase; opacity:0; animation:rise .7s 2.1s ease-out forwards; }
    .features { position:absolute; left:22px; right:22px; bottom:90px; display:flex; gap:9px; }
    .feature { flex:1; min-width:0; padding:13px 10px 12px; border:1px solid rgba(232,220,200,.14); border-radius:15px; background:rgba(18,6,9,.32); backdrop-filter:blur(12px); opacity:0; transform:translateY(18px); animation:card .7s ease-out forwards; }
    .feature:nth-child(1){animation-delay:2.35s}.feature:nth-child(2){animation-delay:2.55s}.feature:nth-child(3){animation-delay:2.75s}
    .feature .icon { color:var(--cream-soft); font-size:18px; line-height:1; margin-bottom:9px; }
    .feature strong { display:block; font-size:11px; letter-spacing:.04em; color:var(--cream); }
    .feature span { display:block; margin-top:3px; font-size:9px; color:var(--muted); white-space:nowrap; }
    .footer { position:absolute; left:24px; right:24px; bottom:25px; display:flex; align-items:center; gap:12px; opacity:0; animation:rise .8s 3.1s ease-out forwards; }
    .progress { height:3px; flex:1; border-radius:20px; background:rgba(232,220,200,.12); overflow:hidden; }
    .progress i { display:block; width:72%; height:100%; background:linear-gradient(90deg,var(--burgundy),var(--cream)); animation:load 4s linear infinite; }
    .footer small { color:rgba(232,220,200,.45); font-size:9px; letter-spacing:.12em; text-transform:uppercase; }
    .replay { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); border:1px solid rgba(232,220,200,.22); border-radius:99px; padding:9px 15px; color:var(--cream); background:rgba(18,6,9,.8); cursor:pointer; font-size:11px; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes drop { 0% { transform:translateY(-110px) scale(.5); opacity:0; } 60% { transform:translateY(7px) scaleX(1.15) scaleY(.82); opacity:1; } 78% { transform:translateY(-3px) scaleX(.94) scaleY(1.05); } 100% { transform:translateY(0) scale(1); opacity:1; } }
    @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
    @keyframes glow { 0%,100% { transform:scale(1); opacity:.3; } 50% { transform:scale(1.55); opacity:.55; } }
    @keyframes ring { 0% { transform:scale(.5); opacity:0; } 45% { opacity:1; } 100% { transform:scale(1.25); opacity:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    @keyframes card { to { opacity:1; transform:none; } }
    @keyframes load { 0% { transform:translateX(-100%); } 100% { transform:translateX(140%); } }
    @keyframes drift { to { transform:translate(28px, 18px) scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="Prévia animada da abertura do Movix">
    <div class="orb one"></div><div class="orb two"></div><div class="grain"></div>
    <div class="topline"><span><b>MOVIX</b> / conceito 01</span><button class="skip" onclick="replay()">Repetir</button></div>
    <section class="hero">
      <div class="mark-wrap">
        <svg viewBox="0 0 480 480" aria-hidden="true">
          <path class="m-line" d="M130 332 V152 L240 274 L350 152 V332" />
          <circle class="dot-glow" cx="240" cy="112" r="30" />
          <circle class="dot" cx="240" cy="112" r="24" />
        </svg>
        <div class="wordmark">MOVIX</div>
        <div class="tagline">sua evolução começa aqui</div>
      </div>
    </section>
    <section class="features" aria-label="Recursos">
      <article class="feature"><div class="icon">✦</div><strong>Treino</strong><span>rotina com propósito</span></article>
      <article class="feature"><div class="icon">◌</div><strong>Evolução</strong><span>progresso visível</span></article>
      <article class="feature"><div class="icon">◇</div><strong>Nutrição</strong><span>hábitos que ficam</span></article>
    </section>
    <div class="footer"><div class="progress"><i></i></div><small>preparando</small></div>
  </main>
  <button class="replay" onclick="replay()">↻ Reiniciar prévia</button>
  <script>
    function replay(){ const s=document.querySelector('.stage'); s.style.display='none'; void s.offsetWidth; s.style.display='block'; }
  </script>
</body>
</html>
